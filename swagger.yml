swagger: "2.0"
info:
  description: Este es el archivo que va con nuestro código de servidor
  version: "1.0.0"
  title: API Tipo de Cambio BCCR
consumes:
  - "application/json"
produces:
  - "application/json"

basePath: "/api"

# Paths supported by the server application
paths:
  /tipodecambio:
    get:
      operationId: "tipodecambio.read"
      tags:
        - "tipodecambio"
      summary: "La estructura de datos de cambio de moneda (euro/dólar/colón) soportada por la aplicación del servidor"
      description: "Lea la lista de intercambio de moneda(compra/venta)"
      responses:
        200:
          description: "Operación exitosa de la lista de intercambio de lectura"
          schema:
            type: "array"
            items:
              properties:
                divisa:
                  type: "string"
                compra:
                  type: "integer"
                  type: "number"
                venta:
                  type: "integer"
                  type: "number"
                fecha:
                  type: "string"

  /tipodecambio/semanal:
    get:
      operationId: "tipodecambio.read_weekly"
      tags:
        - "tipodecambio"
      summary: "Serie semanal de tipos de cambio"
      description: "Retorna la evolución diaria de dólar y euro para los últimos 7 días"
      responses:
        200:
          description: "Operación exitosa de la serie semanal"
          schema:
            type: "array"
            items:
              properties:
                date:
                  type: "string"
                usd:
                  type: "object"
                euro:
                  type: "object"
